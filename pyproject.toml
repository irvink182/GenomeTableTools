[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "genometabletools"
version = "1.3.0"
description = "A Python toolkit for manipulating large genomic metadata tables."
readme = "README.md"
requires-python = ">=3.10"

authors = [
    {name = "Irving Cancino-Muñoz"},
]

dependencies = [
    "pandas>=2.0",
    "openpyxl>=3.1",
]

[tool.setuptools.packages.find]
include = ["genometabletools*"]

[project.scripts]
genometabletools = "genometabletools.cli.main:main"
